openapi: 3.0.3
info:
  title: Checkout Orchestrator API
  version: 1.0.0
  description: >-
    Runs one checkout as a saga over four downstream services: payment,
    inventory, shipping and notification. Steps run strictly one after the
    other. If a step fails or times out, the completed steps that have an
    undo (inventory, payment) are rolled back in reverse order.
  contact:
    name: Absal Antu
    email: absalantu@gmail.com
servers:
  - url: http://localhost:3000
    description: Local orchestrator started with docker compose.
tags:
  - name: checkout
    description: The checkout saga and its idempotency rules.
  - name: health
    description: Liveness.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness check
      description: Returns 200 while the orchestrator process is serving requests.
      responses:
        "200":
          description: The orchestrator is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Run the checkout saga for one canonical order
      description: >-
        Charges payment, reserves inventory, creates the shipment and sends
        the notification, in that order. The amount is the sum of
        unitPrice times quantity over the items, as a two-digit decimal
        string. The recipient is customer.email. The same
        Idempotency-Key with the same body returns the first response
        without running the saga again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Caller-chosen key for this checkout. Reusing it with the same
            body replays the first result. Reusing it with a different body
            is a 409.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: A canonical order with at most 25 items.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: All four steps succeeded. Saga status is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "400":
          description: The Idempotency-Key header is missing, or the body is not a valid order (code validation_error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The key was used with a different body (idempotency_payload_mismatch),
            or a request with this key is still running (idempotency_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          description: >-
            A step failed. Status is failed if nothing needed undoing or an
            undo failed (compensation_failed), and compensated if the undo
            succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "504":
          description: A step did not answer within the request timeout. Status is failed or compensated, and code is timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
components:
  schemas:
    HealthStatus:
      type: object
      description: Liveness body.
      required: [status]
      properties:
        status:
          type: string
          description: Always ok.
          enum: [ok]
    Address:
      type: object
      description: Shipping address.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street and number.
          minLength: 1
        city:
          type: string
          description: City.
          minLength: 1
        postalCode:
          type: string
          description: Postal code, for example LV-1001.
          minLength: 1
        country:
          type: string
          description: Country code, for example LV.
    Customer:
      type: object
      description: Who placed the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Full name, diacritics kept.
          minLength: 1
        email:
          type: string
          description: Notification recipient.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: One priced line of the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product id in the form PROD-123.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Product name.
          minLength: 1
        quantity:
          type: integer
          description: Units ordered, at least 1.
          minimum: 1
        unitPrice:
          type: string
          description: Price per unit as a decimal string with two digits, for example "22.50".
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          description: Currency of unitPrice, for example EUR.
        taxRate:
          type: number
          description: Tax rate as a fraction, for example 0.21.
          minimum: 0
          maximum: 1
    CanonicalOrder:
      type: object
      description: >-
        The canonical order, restated from canonical/order.schema.json with
        one difference: items is limited to 25 entries.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order id from the source system.
          minLength: 1
        orderType:
          type: string
          description: Kind of order.
          enum: [standard, express, b2b]
        source:
          type: string
          description: Which translator produced the order.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          description: When the canonical record was produced.
          format: date-time
        orderDate:
          type: string
          description: When the customer placed the order, in UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: Order lines, 1 to 25.
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Order currency, for example EUR.
        status:
          type: string
          description: Order status.
          enum: [new, processing, shipped, delivered]
    TraceEntry:
      type: object
      description: One call the saga made, including undo calls.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: Which call this was.
          enum: [payment, inventory, shipping, notification, inventory_release, payment_refund]
        status:
          type: string
          description: How the call ended.
          enum: [success, failed, timeout]
        startedAt:
          type: string
          description: When the call started.
          format: date-time
        finishedAt:
          type: string
          description: When the call ended.
          format: date-time
        durationMs:
          type: integer
          description: Whole milliseconds the call took.
          minimum: 0
    CheckoutResult:
      type: object
      description: Outcome of a checkout saga.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The orderId from the request.
          minLength: 1
        status:
          type: string
          description: Final saga status.
          enum: [completed, failed, compensated]
        code:
          type: string
          description: Why it did not complete, for example timeout, compensation_failed, or the failing service's own code. Absent when completed.
        trace:
          type: array
          description: Every call in the order it ran. At most 6 forward and undo calls in total.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceEntry"
    ErrorBody:
      type: object
      description: Error returned for validation and idempotency problems.
      required: [code, message]
      properties:
        code:
          type: string
          description: One of validation_error, idempotency_payload_mismatch, idempotency_conflict.
          enum: [validation_error, idempotency_payload_mismatch, idempotency_conflict]
        message:
          type: string
          description: Explanation for the developer calling the API.
          minLength: 1
